name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A version tag (v1.2.3) also publishes the build to itch.io (job "itch").
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs; on main, queue instead so a deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Public by design (they ship in the page); empty means no cloud save in the build.
          # See supabase/README.md.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Build and zip for itch.io (no cloud save)
        # itch.io serves every uploaded game from one shared origin, so another
        # game could read the cloud sign-in token from localStorage. The itch.io
        # build leaves the cloud settings out, which hides cloud save there.
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build && npm run zip
      - name: Upload itch.io build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itch-build
          path: office-immortal-web.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  check:
    # The required status check on main (ruleset "protect-main"): green only
    # when every job above is. Add new jobs to `needs`.
    name: Lint, test, build
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: needs.build.result != 'success'
        run: exit 1

  deploy:
    # Publishes the tested build from the job above, only after the required
    # check is green, only for pushes to main.
    name: Deploy to GitHub Pages
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  itch:
    # Publishes the tested build from the job above to itch.io, only for a
    # version tag, only after the required check is green and the "itch"
    # environment's reviewer approves. Needs the environment secret
    # BUTLER_API_KEY and the variable ITCH_GAME ("user/game"); see the README's
    # "Release on itch.io".
    name: Publish to itch.io
    needs: [check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: itch
    concurrency:
      group: itch
      cancel-in-progress: false
    env:
      BUTLER_VERSION: 15.32.0
      # sha256 of butler's linux-amd64 archive for BUTLER_VERSION; change both together.
      BUTLER_SHA256: 2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5
    steps:
      - name: Tag is on main
        # Publish only commits that landed on main through a PR.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" -q .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::${GITHUB_REF_NAME} is not on main (compare status: ${status})."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: itch-build
      - name: Install butler
        run: |
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  butler.zip" | sha256sum -c -
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::error::Set the BUTLER_API_KEY secret and ITCH_GAME variable (README, Release on itch.io)."
            exit 1
          fi
          ./butler/butler push office-immortal-web.zip "${ITCH_GAME}:html5" --userversion "$VERSION"
